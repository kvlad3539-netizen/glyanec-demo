<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23F08DB4%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%231A0F14%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239D2C5E%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%2216%22%20fill%3D%22url(%23g)%22%2F%3E%3C%2Fsvg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Бархат Старт</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  /* Layout: витрина студии (обложка «до/после» → услуги с ценой по классу авто → работы → контакты); запись — нижний лист; кабинет — отдельный экран с вкладками */
  --bg:#F7F2F0; --surface:#FFFFFF; --surface-2:#F0E7E4; --ink:#1E1418; --muted:#6E5F66; --line:#E6DAD6;
  --accent:#9D2C5E; --accent-ink:#FFFFFF; --accent-soft:#F6E1EA;
  --good:#0F7A48; --good-soft:#DCF2E6; --warn:#9A5B0B; --warn-soft:#FAEAD2; --bad:#B42318; --bad-soft:#FBE2DF;
  --hero-bg:#1A0F14; --hero-ink:#F8EEF1; --hero-muted:#CDB8C1; --hero-line:rgba(238,242,249,.28);
  --tg:#E4EFFA; --scrim:rgba(6,10,20,.52);
  --shadow:0 1px 2px rgba(13,19,32,.05),0 6px 20px rgba(13,19,32,.07);
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120C0F; --surface:#1C1418; --surface-2:#271C21; --ink:#F3E9EC; --muted:#AA98A0; --line:#38292F;
  --accent:#F08DB4; --accent-ink:#2A0E1A; --accent-soft:#3B1B2A;
  --good:#45C98C; --good-soft:#12301F; --warn:#E3A64E; --warn-soft:#33240E; --bad:#F2705F; --bad-soft:#3A1612;
  --hero-bg:#0D080A; --tg:#17263A; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#120C0F; --surface:#1C1418; --surface-2:#271C21; --ink:#F3E9EC; --muted:#AA98A0; --line:#38292F;
  --accent:#F08DB4; --accent-ink:#2A0E1A; --accent-soft:#3B1B2A;
  --good:#45C98C; --good-soft:#12301F; --warn:#E3A64E; --warn-soft:#33240E; --bad:#F2705F; --bad-soft:#3A1612;
  --hero-bg:#0D080A; --tg:#17263A; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.has-cart{padding-bottom:88px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sp{flex:1}
.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.15em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:700;border:1px solid transparent;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-d{background:var(--surface);border-color:var(--line);color:var(--bad)}
.btn-hg{background:transparent;border-color:var(--hero-line);color:var(--hero-ink)}
.btn:disabled{opacity:.45}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* demo bar */
.demobar{background:var(--accent);color:var(--accent-ink);font-size:13px}
.demobar .wrap{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;padding-block:8px}
.demobar-note{opacity:.85}
.demobar button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;color:inherit}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:60px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.08em;color:var(--ink)}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,var(--accent) 0%,var(--hero-bg) 55%,var(--accent) 100%);flex:none}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{background:none;border:0;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--muted)}
.nav button:hover{color:var(--ink);background:var(--surface-2)}
.adm-label{font-size:13px;font-weight:700;color:var(--muted);padding:3px 8px;border-radius:6px;background:var(--surface-2)}
@media (max-width:820px){.nav{display:none}}
@media (max-width:440px){.hide-xs{display:none}.brand{font-size:15px}}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:36px;align-items:center;padding-block:48px 44px}
.hero .eyebrow{color:var(--hero-muted)}
.hero h1{font-size:clamp(26px,4.4vw,44px);line-height:1.12;margin:12px 0 14px}
.lead{color:var(--hero-muted);font-size:16px;max-width:46ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.avail{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:22px;font-size:14px;color:var(--hero-muted)}
.avail .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(69,201,140,.18)}
.tchip{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--hero-line);background:transparent;color:var(--hero-ink)}
.tchip:hover{background:rgba(255,255,255,.08)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:26px;padding-block:30px 32px}}

.panel{position:relative;margin:0;aspect-ratio:5/4;width:100%;max-width:100%;border-radius:20px;overflow:hidden;isolation:isolate;background:#0B1B4A}
.half{position:absolute;top:0;bottom:0;width:50%}
.before{left:0;background:repeating-radial-gradient(circle at 78% 30%,rgba(255,255,255,.07) 0 1px,transparent 1px 6px),linear-gradient(160deg,#34436A,#222F52 50%,#161F38);filter:saturate(.55) brightness(.9)}
.after{right:0;overflow:hidden;background:radial-gradient(90% 55% at 70% 14%,rgba(255,255,255,.6),rgba(255,255,255,0) 50%),radial-gradient(60% 40% at 30% 85%,rgba(120,160,255,.35),rgba(0,0,0,0) 70%),linear-gradient(162deg,#3A66FF 0%,#1640D6 38%,#0B2380 70%,#061243)}
.after::after{content:"";position:absolute;inset:-20% -120%;background:linear-gradient(105deg,rgba(255,255,255,0) 44%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 56%);transform:translateX(-45%);animation:sweep 2.6s .5s cubic-bezier(.45,0,.2,1) both}
@keyframes sweep{to{transform:translateX(45%)}}
.seam{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.85);transform:translateX(-1px)}
.tag{position:absolute;top:14px;font:600 11px/1 var(--f-mono);letter-spacing:.14em;padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.4);color:#fff}
.tag-l{left:14px}.tag-r{right:14px}
.read{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.read span{background:rgba(4,8,20,.6);backdrop-filter:blur(6px);border-radius:10px;padding:8px 10px;color:#fff;min-width:0}
.read small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read b{font-family:var(--f-mono);font-size:16px;font-weight:600}
@media (prefers-reduced-motion:reduce){.after::after{animation:none;opacity:0}}

/* sections */
.section{padding-block:52px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sec-head h2{font-size:clamp(22px,3vw,30px);margin-top:6px}
.sec-sub{color:var(--muted);margin-top:6px;max-width:60ch}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;white-space:nowrap;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;white-space:nowrap;font-weight:700;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.svc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.svc-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.svc h3{font-size:16px;font-weight:800;line-height:1.3}
.svc p{color:var(--muted);font-size:14px}
.svc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.price{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}

.works{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.works{grid-template-columns:repeat(2,minmax(0,1fr))}}
.work{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.work-img{aspect-ratio:4/3;max-width:100%;position:relative}
.work-img::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 70% 18%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%)}
.work-img span{position:absolute;left:10px;bottom:10px;z-index:1;font:600 11px/1 var(--f-mono);letter-spacing:.06em;padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.5);color:#fff}
.work-cap{padding:12px 14px}
.work-cap b{display:block;font-size:14px}
.work-cap small{color:var(--muted)}

.contacts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
@media (max-width:760px){.contacts{grid-template-columns:1fr}}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.cbox dt{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cbox dd{margin:4px 0 0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cbox dl{margin:0;display:flex;flex-direction:column;gap:16px}
.map{border-radius:14px;border:1px dashed var(--line);min-height:240px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;background:repeating-linear-gradient(0deg,var(--surface-2) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,var(--surface-2) 0 1px,transparent 1px 28px),var(--surface)}
.map .ic{width:28px;height:28px;color:var(--accent);margin-bottom:8px}
.copy{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px}

/* cart */
.cart{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08);padding:10px var(--gr) calc(10px + env(safe-area-inset-bottom,0px)) var(--gl)}
.cart-in{max-width:1088px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.cart-in b{display:block;font-size:15px}
.cart-in small{color:var(--muted)}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;overscroll-behavior:contain}
@media (min-width:700px){.sheet-bg{align-items:center;padding:24px}.sheet{border-radius:20px;max-height:88vh}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px var(--gr) 12px var(--gl);border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:17px;font-weight:800;flex:1;min-width:0}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);font-size:20px;line-height:1;flex:none}
.sheet-body{padding:16px var(--gr) 20px var(--gl);display:flex;flex-direction:column;gap:14px}
.sheet-foot{position:sticky;bottom:0;z-index:2;background:var(--bg);border-top:1px solid var(--line);padding:12px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gl);display:flex;gap:10px;align-items:center}
.sheet-foot .btn{flex:none}
.foot-sum{flex:1;min-width:0}
.foot-sum b{display:block}
.foot-sum small{color:var(--muted)}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;font-size:12px;font-weight:700;color:var(--muted)}
.steps li{flex:1;border-top:3px solid var(--line);padding-top:6px}
.steps li.done{border-color:var(--accent);color:var(--ink)}
.steps li.cur{border-color:var(--accent);color:var(--accent)}
.grp{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.opt:first-child{border-top:0}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.opt-n{flex:1;min-width:0;font-weight:600}
.opt-n small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.picked{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.picked div{min-width:0}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 66px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.day small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day b{font-family:var(--f-mono);font-size:18px}
.day em{font-style:normal;font-size:10px;color:var(--good);font-weight:700}
.day:disabled{opacity:.45}
.day:disabled em{color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] em{color:var(--bg)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.slot{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--ink)}
.slot:disabled{text-decoration:line-through;opacity:.4;background:transparent}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note .ic{color:var(--accent);margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field label small{color:var(--muted);font-weight:500}
input[type="text"],input[type="tel"],input[type="search"],textarea{font:inherit;font-size:16px;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
.field.bad input{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.err:empty{display:none}
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sumcard .row{display:flex;justify-content:space-between;gap:12px}
.sumcard .row span:first-child{color:var(--muted)}
.sumcard .row span:last-child{text-align:right;font-weight:600}
.sumcard .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-size:16px}
.fine{font-size:12px;color:var(--muted)}
.done-hd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.ok{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.ok .ic{width:28px;height:28px;stroke-width:2.6}
.done-hd h3{font-family:var(--f-display);font-size:22px}
.tg{background:var(--tg);border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:14px;max-width:360px;line-height:1.45}
.tg-h{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:4px}
.tg p+p{margin-top:2px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.feat li .ic{margin-top:2px}
.feat li.in .ic{color:var(--good)}
.feat li.out{color:var(--muted)}
.lockbox{display:flex;flex-direction:column;gap:8px}
.lockbox>.ic{width:30px;height:30px;color:var(--accent)}

/* status */
.st{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.4}
.st-new{background:var(--accent-soft);color:var(--accent)}

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seedData(){
  const r = rng(20261113 + LVL);
  const today = todayStr(), nm = nowMin();
  const clients = CLIENTS.map((c, i) => {
    const n = String(1234567 + i * 379157).slice(-7);
    return {id:"c" + i, name:c[0], car:c[1], cls:c[2], phone:"+380 00 " + n.slice(0,3) + " " + n.slice(3,5) + " " + n.slice(5)};
  });
  const bookings = []; let n = 0;
  for (let d = -35; d <= 6; d++){
    const date = addDays(today, d);
    BOXES.forEach((_, box) => {
      let t = OPEN + Math.floor(r() * 3) * 30;
      const target = d > 0 ? 2 + Math.floor(r() * 2) : 3 + Math.floor(r() * 3);
      for (let k = 0; k < target; k++){
        const combo = COMBOS[Math.floor(r() * COMBOS.length)];
        const dur = durOf(combo);
        if (t + dur > CLOSE) break;
        const c = clients[Math.floor(r() * clients.length)];
        let status;
        if (d < 0 || (d === 0 && t + dur <= nm)){
          const x = r();
          status = x < 0.9 ? "done" : (x < 0.95 || !has.boxes) ? "cancelled" : "noshow";
        } else status = (d >= 1 && r() < 0.3) ? "new" : "confirmed";
        bookings.push({id:"b" + (n++), clientId:c.id, date, start:t, dur, services:combo, cls:c.cls, total:priceOf(combo, c.cls), status, box, source:status === "new" || r() < 0.55 ? "site" : "admin", note:""});
        t += dur + Math.floor(r() * 4) * 30;
      }
    });
  }
  return {v:1, seedDate:today, clients, bookings, remind:{d1:true, h2:true, review:false, channel:"viber"}};
}
const KEY = "barhat-demo-" + T.id + "-v1";
function load(){
  const fresh = seedData();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { saved = null; }
  if (!saved || saved.v !== 1 || !Array.isArray(saved.bookings)) return fresh;
  if (saved.seedDate === fresh.seedDate) return saved;
  fresh.clients.push(...saved.clients.filter(c => c.mine));
  fresh.bookings.push(...saved.bookings.filter(b => b.mine));
  if (saved.remind) fresh.remind = saved.remind;
  return fresh;
}

function isBusy(date, box, t, dur){
  return S.bookings.some(b => b.date === date && b.box === box && OCC(b.status) && t < b.start + b.dur && b.start < t + dur);
}
function slotsFor(date, dur, pref){
  const out = [], today = todayStr(), nm = nowMin();
  if (date < today) return out;
  const boxes = BOXES.map((_, i) => i).filter(i => pref < 0 || i === pref);
  for (let t = OPEN; t + dur <= CLOSE; t += 30){
    if (date === today && t < nm + 30) continue;
    const free = boxes.find(i => !isBusy(date, i, t, dur));
    out.push({t, box: free === undefined ? -1 : free});
  }
  return out;
}

function startW(o){
  o = o || {};
  W = {mode: o.admin ? "admin" : "site", step: 0, svc: new Set(o.admin ? [] : ui.cart), cls: o.admin ? "s" : ui.cls,
       date: o.date || null, start: null, box: 0, pref: -1, prefT: o.t != null ? o.t : null,
       name: "", phone: "", car: "", note: "", err: {}, result: null};
  if (o.clientId){ const c = cl(o.clientId); W.name = c.name; W.phone = c.phone; W.car = c.car; W.cls = c.cls; }
  if (W.svc.size) W.step = 1;
  drawW();
}
function wDur(){ return durOf([...W.svc]); }
function wFix(){
  const dur = wDur(), t = todayStr();
  const days = []; for (let i = 0; i < 14; i++) days.push(addDays(t, i));
  if (!W.date || W.date < t || freeCount(W.date, dur, W.pref) === 0) W.date = days.find(d => freeCount(d, dur, W.pref) > 0) || days[0];
  const slots = slotsFor(W.date, dur, W.pref);
  if (W.prefT != null){
    const s = slots.find(x => x.t === W.prefT && x.box >= 0);
    if (s){ W.start = s.t; W.box = s.box; }
    W.prefT = null;
  }
  if (W.start != null){
    const s = slots.find(x => x.t === W.start && x.box >= 0);
    if (!s) W.start = null; else if (W.pref >= 0 || isBusy(W.date, W.box, W.start, dur)) W.box = s.box;
  }
  return {dur, days, slots};
}

    body = wSummaryCard() +

function normPhone(v){
  let d = String(v || "").replace(/\D/g, "");
  if (d.length === 10 && d[0] === "0") d = "38" + d;
  if (d.length === 9) d = "380" + d;
  return d.length === 12 && d.startsWith("380") ? d : null;
}
const fmtPhone = d => "+" + d.slice(0,3) + " " + d.slice(3,5) + " " + d.slice(5,8) + " " + d.slice(8,10) + " " + d.slice(10);
function wSubmit(){
  W.err = {};
  if (W.name.trim().length < 2) W.err.name = "Укажите имя";
  const ph = normPhone(W.phone);
  if (!ph) W.err.phone = "Введите номер в формате +380 XX XXX XX XX";
  if (W.err.name || W.err.phone){
    drawW(true);
    const f = sheetEl.querySelector(".field.bad input"); if (f) f.focus();
    return;
  }
  const dur = wDur();
  if (isBusy(W.date, W.box, W.start, dur)){ toast("Это время только что заняли — выберите другое"); W.step = 1; W.start = null; drawW(); return; }
  let c = S.clients.find(x => normPhone(x.phone) === ph);

  const body = '<div class="det">' + chip(b.status) + '<p class="det-big">' + fmtDate(b.date) + " · " + fmtT(b.start) + "–" + fmtT(b.start + b.dur) + '</p>' + (has.boxes ? '<p class="muted">' + BOXES[b.box].name + " · мастер " + BOXES[b.box].master + '</p>' : "") + '</div>' +
    '<div class="sumcard"><div class="row"><span>Клиент</span><span>' + esc(c.name) + '</span></div><div class="row"><span>Телефон</span><span class="mono">' + esc(c.phone) + ' <button class="copy" data-act="copy" data-v="' + esc(c.phone) + '">' + I.copy + '</button></span></div><div class="row"><span>Instagram</span><span>' + esc(c.car) + " · " + CLS[b.cls].short.toLowerCase() + '</span></div>' +
    b.services.map(sid => '<div class="row"><span>' + SV[sid].name + '</span><span class="mono">' + money(SV[sid].p[CI[b.cls]]) + '</span></div>').join("") +
    '<div class="row tot"><span>Итого</span><span class="mono">' + money(b.total) + '</span></div></div>' +
    (b.note ? '<p class="note"><span>' + esc(b.note) + '</span></p>' : "") +
    '<p class="fine">' + (b.source === "site" ? "Запись с сайта" : "Добавлено вручную") + '</p>' +
    (rem ? '<h4 class="grp">Напоминания клиенту</h4><div>' + rem + '</div>' : "");
  let foot = "";
  if (b.status === "new") foot = '<button class="btn btn-d" data-act="st" data-id="' + id + '" data-s="cancelled">Отменить</button><span class="sp"></span><button class="btn btn-p" data-act="st" data-id="' + id + '" data-s="confirmed">Подтвердить</button>';
  else if (b.status === "confirmed") foot = '<button class="btn btn-d" data-act="st" data-id="' + id + '" data-s="cancelled">Отменить</button>' + (has.boxes ? '<button class="btn btn-g" data-act="st" data-id="' + id + '" data-s="noshow">Не пришёл</button>' : "") + '<span class="sp"></span><button class="btn btn-p" data-act="st" data-id="' + id + '" data-s="done">' + I.check + 'Выполнено</button>';
  else if (b.status === "done") foot = '<button class="btn btn-g" data-act="client" data-id="' + c.id + '">Карточка клиента</button><span class="sp"></span><button class="btn btn-p" data-act="close">Закрыть</button>';
  else foot = '<button class="btn btn-g" data-act="st" data-id="' + id + '" data-s="confirmed">Вернуть запись</button><span class="sp"></span><button class="btn btn-p" data-act="close">Закрыть</button>';
  openSheet("Заказ", body, foot);
}
function setStatus(id, s){
  const b = bkById(id); if (!b) return;
  if (s === "confirmed" && !OCC(b.status) && S.bookings.some(x => x.id !== b.id && x.date === b.date && x.box === b.box && OCC(x.status) && b.start < x.start + x.dur && x.start < b.start + b.dur)){
    toast("Это время уже занято другой записью"); return;
  }
  b.status = s; save(); closeSheet(); drawAdmin();
  toast({confirmed:"Запись подтверждена", done:"Работа отмечена выполненной", cancelled:"Запись отменена", noshow:"Отмечено: клиент не пришёл"}[s]);
}
function clientSheet(id){
  const x = clientStats().find(v => v.c.id === id); if (!x) return;
  const hist = x.all.slice().sort(byDT).reverse();
  const body = '<div class="det"><p class="det-big">' + esc(x.c.name) + '</p><p class="muted">' + esc(x.c.car) + " · " + CLS[x.c.cls].name.toLowerCase() + '</p><p><span class="mono">' + esc(x.c.phone) + '</span> <button class="copy" data-act="copy" data-v="' + esc(x.c.phone) + '">' + I.copy + 'Скопировать</button></p></div>' +
    '<div class="kpis"><div class="kpi"><small>Визитов</small><b>' + x.visits + '</b></div><div class="kpi"><small>Потратил</small><b>' + money(x.spent) + '</b></div><div class="kpi"><small>Средний чек</small><b>' + money(x.visits ? Math.round(x.spent / x.visits) : 0) + '</b></div></div>' +
    '<h4 class="grp">История визитов</h4><div class="list">' + hist.map(b => orow(b, true)).join("") + '</div>';
  openSheet("Клиент", body, '<button class="btn btn-g" data-act="close">Закрыть</button><span class="sp"></span><button class="btn btn-p" data-act="rebook" data-id="' + id + '">' + I.plus + 'Записать снова</button>');
}

/* ---------- render / routing ---------- */
function render(){
  drawDemoBar();
  if (ui.view === "admin"){ app.innerHTML = adminHTML(); drawAdmin(); }
  else { app.innerHTML = siteHTML(); drawSvc(); drawProgs(); drawAvail(); }
  drawCart();
}
function route(){
  const v = location.hash === "#kabinet" && has.cabinet ? "admin" : "site";
  if (v !== ui.view){ ui.view = v; closeSheet(); render(); window.scrollTo(0, 0); }
}

const A = {
  features: featuresSheet,
  reset(){
    if (!resetArmed){ resetArmed = true; drawDemoBar(); setTimeout(() => { resetArmed = false; drawDemoBar(); }, 3000); return; }
    resetArmed = false;
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = seedData(); save(); ui.cart.clear(); ui.schedDate = todayStr(); closeSheet(); render(); toast("Демо сброшено к исходным данным");
  },
  lock: el => lockSheet(+el.dataset.lvl, el.dataset.what),
  go: el => { const t = document.getElementById(el.dataset.to); if (t) t.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth"}); },
  top: () => window.scrollTo({top:0, behavior: reduceMotion ? "auto" : "smooth"}),
  cls: el => { ui.cls = el.dataset.v; drawSvc(); drawProgs(); drawCart(); },
  prog: el => { const p = PROGRAMS.find(x => x.id === el.dataset.id); ui.cart = new Set(p.ids); drawSvc(); drawCart(); startW({}); },
  work: el => workSheet(+el.dataset.i),
  workbook: el => { const g = GALLERY[+el.dataset.i]; closeSheet(); ui.cart = new Set(g.ids); ui.cls = g.cls; drawSvc(); drawProgs(); drawCart(); startW({}); },
  cat: el => { ui.cat = el.dataset.v; drawSvc(); },
  toggle: el => { const id = el.dataset.id; if (ui.cart.has(id)) ui.cart.delete(id); else ui.cart.add(id); drawSvc(); drawCart(); },
  book: () => startW({}),
  bookAt: el => startW({date:el.dataset.d, t:+el.dataset.t}),
  close: closeSheet,
  bgclose: (el, e) => { if (e.target === el) closeSheet(); },
  wnext: () => { if (W && W.svc.size){ W.step = 1; drawW(); } },
  wgo: el => { if (!W) return; W.step = +el.dataset.s; drawW(); },
  wcls: el => { W.cls = el.dataset.v; drawW(true); },
  wpref: el => { W.pref = +el.dataset.v; W.start = null; drawW(true); },
  wday: el => { W.date = el.dataset.d; W.start = null; drawW(true); },
  wslot: el => { W.start = +el.dataset.t; W.box = +el.dataset.b; drawW(true); },
  wsubmit: wSubmit,
  wcab: () => { const d = W && W.result ? W.result.date : todayStr(); closeSheet(); ui.tab = "schedule"; ui.schedDate = d; location.hash = "kabinet"; },
  tosite: () => { location.hash = ""; },
  admbook: () => startW({admin:true}),
  tab: el => {
    const t = TABS.find(x => x[0] === el.dataset.t);
    if (t[2] > LVL){ lockSheet(t[2], t[1]); return; }
    ui.tab = t[0]; if (el.dataset.f) ui.of = el.dataset.f; drawAdmin();
  },
  sd: el => { ui.schedDate = addDays(ui.schedDate, +el.dataset.n); drawAdmin(); },
  sdToday: () => { ui.schedDate = todayStr(); drawAdmin(); },
  order: el => orderSheet(el.dataset.id),
  st: el => setStatus(el.dataset.id, el.dataset.s),
  of: el => { ui.of = el.dataset.v; drawAdmin(); },
  client: el => clientSheet(el.dataset.id),
  rebook: el => { const id = el.dataset.id; closeSheet(); startW({admin:true, clientId:id}); },
  period: el => { ui.period = el.dataset.v; drawAdmin(); },
  ch: el => { S.remind.channel = el.dataset.v; save(); drawAdmin(); },
  copy: el => {
    const v = el.dataset.v;
    const fallback = () => { const s = el.parentElement && el.parentElement.querySelector(".mono"); if (s){ const r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Номер выделен — скопируйте его"); };
    try { navigator.clipboard.writeText(v).then(() => toast("Номер скопирован"), fallback); } catch (e) { fallback(); }
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const f = A[el.dataset.act]; if (!f) return;
  f(el, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.chg === "wsvc" && W){ if (el.checked) W.svc.add(el.dataset.id); else W.svc.delete(el.dataset.id); W.start = null; drawW(true); }
  if (el.dataset.chg === "rem"){ S.remind[el.dataset.k] = el.checked; save(); drawAdmin(); }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.in && W){
    W[el.dataset.in] = el.value;
    if (W.err[el.dataset.in]){ W.err[el.dataset.in] = ""; const f = el.closest(".field"); if (f){ f.classList.remove("bad"); const er = f.querySelector(".err"); if (er) er.textContent = ""; } }
  }
  if ("ba" in el.dataset){ const box = el.closest(".ba"); if (box) box.style.setProperty("--p", el.value + "%"); }
  if (el.dataset.q){
    ui[el.dataset.q] = el.value;
    const box = el.dataset.q === "q" ? $("#olist") : $("#clist");
    if (box) box.innerHTML = el.dataset.q === "q" ? ordersList() : clientsList();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheetEl.hidden) closeSheet(); });
window.addEventListener("hashchange", route);
route();
})();
</script>

</body>
</html>
